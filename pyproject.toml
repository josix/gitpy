[project]
name = "gitpy"
version = "0.0.1"
description = "Rediscover git through re-implementing it in python"
readme = "docs/README.md"
license = {text = "MIT"}
authors = [{name = "Josix Wang", email = "josixwang@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.urls]
Repository = "https://github.com/josix/gitpy"

[project.scripts]
gitpy = "gitpy.cli:app"

[dependency-groups]
dev = [
    # task management
    "invoke>=2.2",
    # test
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.5",
    "hypothesis>=6.92",
    "coverage[toml]>=7.4",
    # style
    "ruff>=0.1.9",
    "mypy>=1.8",
    # security
    "bandit>=1.7",
    "pip-audit>=2.6",
    # git
    "commitizen>=3.13",
    "pre-commit>=3.6",
    # documentation
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitpy"]

# ============================================================
# Tool Configurations
# ============================================================

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "$version"
version_files = ["pyproject.toml:version"]

[tool.mypy]
python_version = "3.12"
files = ["gitpy", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "W191",   # indentation contains tabs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["gitpy"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "--strict-markers"
norecursedirs = [
    ".*",
    "build",
    "dist",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "venv",
    "env",
    "virtualenv",
    ".venv",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'if self\.debug',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
]
omit = [
    'env/*',
    'venv/*',
    '.venv/*',
    '*/virtualenv/*',
    '*/virtualenvs/*',
    '*/tests/*',
]
